[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-experiment-context"
version = "0.1.0"
description = "Reference implementation for scoped experiment allocations across composable AI-agent executions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Diogo Santos"}]
keywords = ["ai-agents", "experimentation", "ab-testing", "distributed-systems", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
dev = [
  "pytest>=8.0",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
