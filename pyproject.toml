[project]
name = "agent-experiment-context"
version = "0.1.0"
description = "Falsification experiments for scoped experiment context in composable agent systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[grpc,http-server]==1.1.3",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
